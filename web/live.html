<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build Tracker — Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    background: #0b0e13; color: #e8e6e3;
    min-height: 100vh; padding: 24px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: .02em; color: #c8aa6e; }
  .sub { color: #7a8494; font-size: 12px; margin-top: 2px; }
  .card {
    background: #131824; border: 1px solid #1f2738; border-radius: 10px;
    padding: 16px; margin-top: 14px;
  }
  .state { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  .state b { font-size: 17px; }
  .gold { color: #f0c75e; font-weight: 600; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #7a8494; margin-bottom: 8px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .item img { width: 34px; height: 34px; border-radius: 5px; border: 1px solid #2a3040; }
  .item .name { flex: 1; }
  .item .cost { color: #f0c75e; font-size: 13px; min-width: 52px; text-align: right; }
  .buy {
    background: #18213380; border: 1px solid #2c3b5a; border-left: 3px solid #5383e8;
    border-radius: 8px; padding: 8px 10px; margin: 6px 0;
  }
  .arrow { color: #7a8494; font-size: 18px; padding: 0 2px; }
  .target { display: flex; align-items: center; gap: 6px; }
  .target img { width: 26px; height: 26px; border-radius: 4px; border: 1px solid #3a4a6a; }
  .target .tname { font-size: 12px; color: #9fb3d9; max-width: 110px; }
  .save-row {
    background: #2a230f80; border: 1px solid #5a4a1e; border-left: 3px solid #f0c75e;
    border-radius: 8px; padding: 10px; margin: 6px 0;
    display: flex; align-items: center; gap: 10px;
  }
  .save-row .badge { color: #f0c75e; font-weight: 700; letter-spacing: .06em; font-size: 12px; }
  .bar { height: 5px; background: #222a3a; border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; background: #5383e8; }
  .prob { font-size: 12px; color: #7a8494; }
  .offline { text-align: center; color: #7a8494; padding: 40px 0; }
  .inv { display: flex; gap: 6px; flex-wrap: wrap; }
  .inv img { width: 26px; height: 26px; border-radius: 4px; border: 1px solid #2a3040; opacity: .85; }
  footer { margin-top: 14px; font-size: 11px; color: #55607080; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>BUILD TRACKER · LIVE</h1>
  <div class="sub">what a Challenger would buy in this spot</div>
  <div id="content"><div class="card offline">Waiting for a game…</div></div>
  <footer id="foot"></footer>
</div>
<script>
const content = document.getElementById("content");
const foot = document.getElementById("foot");

function icon(ver, id) {
  return `https://ddragon.leagueoflegends.com/cdn/${ver}/img/item/${id}.png`;
}

function itemRow(ver, it, withBar) {
  return `<div class="item">
    <img src="${icon(ver, it.item_id)}" alt="">
    <div class="name">${it.name}
      ${withBar ? `<div class="bar"><i style="width:${Math.round(it.prob * 100)}%"></i></div>` : ""}
    </div>
    <div><div class="cost">${it.cost}g</div><div class="prob">${Math.round(it.prob * 100)}%</div></div>
  </div>`;
}

function buyRow(ver, it) {
  const target = it.target ? `
    <div class="target">
      <span class="arrow">→</span>
      <img src="${icon(ver, it.target.item_id)}" title="${it.target.name}">
      <span class="tname">${it.target.name}</span>
    </div>` : "";
  return `<div class="buy"><div class="item" style="padding:0">
    <img src="${icon(ver, it.item_id)}" alt="">
    <div class="name">${it.name}
      <div class="bar"><i style="width:${Math.round(it.prob * 100)}%"></i></div>
    </div>
    ${target}
    <div><div class="cost">${it.cost}g</div><div class="prob">${Math.round(it.prob * 100)}%</div></div>
  </div></div>`;
}

function saveRow(ver, s) {
  return `<div class="save-row">
    <span class="badge">SAVE</span>
    <span class="arrow">→</span>
    <img class="target-img" src="${icon(ver, s.item_id)}" style="width:30px;height:30px;border-radius:5px;border:1px solid #5a4a1e" title="${s.name}">
    <div class="name">${s.name}</div>
    <div class="cost">need ${s.need}g more</div>
  </div>`;
}

async function tick() {
  try {
    const r = await fetch("/api/live");
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      content.innerHTML = `<div class="card offline">${err.detail || "Model unavailable"}</div>`;
      return;
    }
    const d = await r.json();
    if (!d.in_game) {
      content.innerHTML = `<div class="card offline">No game detected — start a match or Practice Tool.</div>`;
      return;
    }
    const ver = d.ddragon_version;
    const mins = Math.floor(d.game_time_s / 60), secs = String(d.game_time_s % 60).padStart(2, "0");
    content.innerHTML = `
      <div class="card state">
        <b>${d.champion}</b><span>${d.role || ""}</span>
        <span class="gold">${Math.floor(d.gold)}g</span>
        <span>lvl ${d.level}</span><span>${mins}:${secs}</span>
      </div>
      <div class="card">
        <div class="label">Optimal buys</div>
        ${d.basket.map(it => buyRow(ver, it)).join("")}
        ${d.save ? saveRow(ver, d.save) : ""}
        ${!d.basket.length && !d.save ?
          `<div class="offline" style="padding:10px 0">Nothing confident enough right now.</div>` : ""}
      </div>
      <div class="card">
        <div class="label">Top picks</div>
        ${d.top.length ? d.top.map(it => itemRow(ver, it, true)).join("") :
          `<div class="offline" style="padding:10px 0">Nothing buyable — inventory full or all options blocked.</div>`}
      </div>
      <div class="card">
        <div class="label">Your items</div>
        <div class="inv">${d.inventory.map(it => `<img title="${it.name}" src="${icon(ver, it.item_id)}">`).join("")}</div>
      </div>`;
    foot.textContent = `model trained ${d.model_trained_at || "?"} · refreshes every 2s`;
  } catch (e) {
    content.innerHTML = `<div class="card offline">Server unreachable.</div>`;
  }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
