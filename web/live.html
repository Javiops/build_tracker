<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build Tracker — Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    background: #0b0e13; color: #e8e6e3;
    min-height: 100vh; padding: 24px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: .02em; color: #c8aa6e; }
  .sub { color: #7a8494; font-size: 12px; margin-top: 2px; }
  .card {
    background: #131824; border: 1px solid #1f2738; border-radius: 10px;
    padding: 14px 16px; margin-top: 14px;
  }
  .state { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  .state b { font-size: 17px; }
  .gold { color: #f0c75e; font-weight: 600; }
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 14px; }
  .option { background: #131824; border: 1px solid #1f2738; border-radius: 12px; padding: 14px; }
  .option.best { border-color: #c8aa6e; box-shadow: 0 0 0 1px #c8aa6e40, 0 6px 18px #00000050; }
  .option.alternative { border-color: #3d5a96; }
  .option.save-card { border-color: #5a4a1e; background: #171408; }
  .tier { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; margin-bottom: 10px; font-weight: 700; }
  .best .tier { color: #c8aa6e; }
  .alternative .tier { color: #7ea0d8; }
  .situational .tier { color: #7a8494; }
  .save-card .tier { color: #f0c75e; }
  .oitem { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .oitem img { width: 40px; height: 40px; border-radius: 6px; border: 1px solid #2a3040; }
  .oitem .name { flex: 1; font-size: 14px; }
  .oitem .cost { color: #f0c75e; font-size: 12.5px; }
  .toward { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #2a3040; color: #9fb3d9; font-size: 12.5px; }
  .toward img { width: 28px; height: 28px; border-radius: 5px; border: 1px solid #3a4a6a; }
  .savebig { display: flex; align-items: center; gap: 12px; padding: 8px 0 2px; }
  .savebig .coin { font-size: 26px; }
  .savebig .msg { font-size: 14px; color: #e8d9a8; }
  .offline { text-align: center; color: #7a8494; padding: 40px 0; }
  .inv { display: flex; gap: 6px; flex-wrap: wrap; }
  .inv img { width: 26px; height: 26px; border-radius: 4px; border: 1px solid #2a3040; opacity: .85; }
  footer { margin-top: 14px; font-size: 11px; color: #55607080; text-align: center; }
  /* overlay widget mode (?overlay=1): compact, draggable, with a close button */
  body.overlay { padding: 10px; background: #0b0e13f2; cursor: grab; }
  body.overlay .wrap { max-width: none; }
  body.overlay .sub, body.overlay footer { display: none; }
  body.overlay h1 { font-size: 13px; }
  body.overlay .options { grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
  body.overlay .option { padding: 10px 12px; }
  body.overlay .card { padding: 10px 12px; margin-top: 8px; }
  body.overlay .oitem img { width: 32px; height: 32px; }
  body.overlay .oitem { padding: 4px 0; }
  #closer { display: none; position: fixed; top: 6px; right: 8px; color: #7a8494; font-size: 16px;
            cursor: pointer; z-index: 10; padding: 2px 6px; }
  #closer:hover { color: #e8e6e3; }
  body.overlay #closer { display: block; }
</style>
</head>
<body>
<div id="closer" title="Close overlay">✕</div>
<div class="wrap">
  <h1>BUILD TRACKER · LIVE</h1>
  <div class="sub">what a Challenger would do in this spot — three ways to play the visit</div>
  <div id="content"><div class="card offline">Waiting for a game…</div></div>
  <footer id="foot"></footer>
</div>
<script>
const content = document.getElementById("content");
const foot = document.getElementById("foot");
if (new URLSearchParams(location.search).has("overlay")) {
  document.body.classList.add("overlay");
  document.getElementById("closer").addEventListener("click", () => {
    if (window.pywebview) window.pywebview.api.close();
  });
}
const TIER_LABEL = { best: "Best pick", alternative: "Also strong", situational: "If you prefer" };

function icon(ver, id) {
  return `https://ddragon.leagueoflegends.com/cdn/${ver}/img/item/${id}.png`;
}

function optionCard(ver, opt) {
  if (opt.kind === "save") {
    const toward = opt.toward ? `
      <div class="toward">
        <img src="${icon(ver, opt.toward.item_id)}" title="${opt.toward.name}">
        <span>holding for <b>${opt.toward.name}</b>${opt.toward.need ? ` — ${opt.toward.need}g to go` : " — affordable next base"}</span>
      </div>` : "";
    return `<div class="option save-card">
      <div class="tier">Hold your gold</div>
      <div class="savebig"><span class="coin">🪙</span><span class="msg">Buy nothing this visit${opt.toward ? "" : " — bank for the next spike"}</span></div>
      ${toward}
    </div>`;
  }
  const rows = opt.items.map(it => `
    <div class="oitem">
      <img src="${icon(ver, it.item_id)}" alt="">
      <div class="name">${it.name}</div>
      <div class="cost">${it.cost}g</div>
    </div>`).join("");
  const targets = [...new Map(opt.items.filter(it => it.target).map(it => [it.target.item_id, it.target])).values()];
  const toward = targets.length ? `
    <div class="toward">
      ${targets.map(t => `<img src="${icon(ver, t.item_id)}" title="${t.name}">`).join("")}
      <span>building toward <b>${targets.map(t => t.name).join(", ")}</b></span>
    </div>` : "";
  return `<div class="option ${opt.tier}">
    <div class="tier">${TIER_LABEL[opt.tier] || opt.tier}</div>
    ${rows}${toward}
  </div>`;
}

async function tick() {
  try {
    const r = await fetch("/api/live");
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      content.innerHTML = `<div class="card offline">${err.detail || "Model unavailable"}</div>`;
      return;
    }
    const d = await r.json();
    if (!d.in_game) {
      content.innerHTML = `<div class="card offline">No game detected — start a match or Practice Tool.</div>`;
      return;
    }
    const ver = d.ddragon_version;
    const mins = Math.floor(d.game_time_s / 60), secs = String(d.game_time_s % 60).padStart(2, "0");
    const options = (d.options || []).map(o => optionCard(ver, o)).join("");
    content.innerHTML = `
      <div class="card state">
        <b>${d.champion}</b><span>${d.role || ""}</span>
        <span class="gold">${Math.floor(d.gold)}g</span>
        <span>lvl ${d.level}</span><span>${mins}:${secs}</span>
      </div>
      ${options ? `<div class="options">${options}</div>` :
        `<div class="card offline" style="padding:20px 0">Nothing confident enough right now — farm on.</div>`}
      <div class="card">
        <div class="label" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7a8494;margin-bottom:8px">Your items</div>
        <div class="inv">${d.inventory.map(it => `<img title="${it.name}" src="${icon(ver, it.item_id)}">`).join("")}</div>
      </div>`;
    foot.textContent = `model trained ${d.model_trained_at || "?"} · refreshes every 2s`;
  } catch (e) {
    content.innerHTML = `<div class="card offline">Server unreachable.</div>`;
  }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
